[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wingpc-agent"
version = "0.1.0"
description = "LLM control + real-time observation layer for PSS/Agilent WinGPC UniChrom"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "mcp>=2.0",
    "numpy>=1.26",
    "pillow>=10",
    "pyyaml>=6",
    "watchdog>=4",
]

[project.optional-dependencies]
# Install on the Windows PC that runs WinGPC.
windows = [
    "pywinauto>=0.6.8",
    "pywin32>=306",
    "comtypes>=1.4",
    "mss>=9",
]
# Install wherever the Claude-driven agent loop runs (can be the same PC).
llm = ["anthropic>=1.1"]
dev = ["pytest>=8"]

[project.scripts]
wingpc-agent = "wingpc_agent.cli:main"

[tool.setuptools.packages.find]
include = ["wingpc_agent*"]

[tool.setuptools.package-data]
wingpc_agent = ["../recipes/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
